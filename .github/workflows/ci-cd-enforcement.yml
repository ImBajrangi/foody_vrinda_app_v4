name: Multi-Environment & Production Safety CI/CD

on:
  push:
    branches:
      - 'feature/*'
      - beta
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphify-out/**'
      - '.agents/**'
  pull_request:
    branches:
      - beta
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphify-out/**'
      - '.agents/**'

jobs:
  validate_and_test:
    name: Build, Lint & Migration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Migrations for Production Safety
        run: npm run lint:migrations

      - name: Financial Ledger, Authorization & Concurrency Tests
        run: npm run test:billing
        env:
          VITE_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}

      - name: Production Bundle Verification
        run: npm run build

  deploy_dev:
    name: Alpha / Dev Gate (No Remote Deployment)
    needs: validate_and_test
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: development
    steps:
      - name: Verify Alpha Gate Only
        run: |
          echo "Alpha/Dev gate passed for branch ${GITHUB_REF_NAME}. No deployment or database migration was executed."

  deploy_staging:
    name: Beta / Staging Gate (No Remote Deployment)
    needs: validate_and_test
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: staging
    steps:
      - name: Verify Beta Gate Only
        run: |
          echo "Beta/Staging gate passed. No deployment or database migration was executed."

  deploy_production:
    name: Production Gate (No Remote Deployment)
    needs: validate_and_test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: production
    steps:
      - name: Verify Production Gate Only
        run: |
          echo "Production gate passed. This workflow does not deploy code or apply database migrations."
