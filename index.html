  <!-- Immediate Zero-Latency Theme Hydration Script (Avoids Flash of Dark/Light) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('foody_theme');
        var theme = (saved === 'light' || saved === 'dark')
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.classList.remove('light', 'dark');
        root.classList.add(theme);
        var meta = document.getElementById('theme-color-meta');
        if (meta) {
          meta.setAttribute('content', theme === 'light' ? '#FAF7F2' : '#1E1B1C');
        }
      } catch (e) { }
    })();
  </script>

  <style>
    html,

    [data-theme="dark"],

    /* Clean Initial Boot Loader — Zero Fullscreen Splash, Instant Mount */
    .initial-boot-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      background-color: #FAF7F2;
    }

    [data-theme="dark"] .initial-boot-loader,
    .dark .initial-boot-loader {
      background-color: #1E1B1C;
    }

    @media (prefers-color-scheme: dark) {
      body:not([data-theme="light"]):not(.light) .initial-boot-loader {
        background-color: #1E1B1C;
      }
    }

    @keyframes initialCircle {
      0% {

        height: 4px;

      }
      40% {

        border-radius: 50%;
        transform: scaleX(1);
      }
      100% {
        top: 0%;
      }
    }

    @keyframes initialShadow {
      0% {
        transform: scaleX(1.5);
      }
      40% {
        transform: scaleX(1);
        opacity: .7;
      }
      100% {
        transform: scaleX(.2);
        opacity: .4;
      }
    }

  <script>
    // Global deployment chunk recovery: auto-reload when stale bundle chunks return text/html
    window.addEventListener('error', function (e) {
      var msg = String(e && (e.message || e.error && e.error.message) || '');
      if (/loading chunk|failed to fetch dynamically imported module|importing a module script failed|mime type|not a valid javascript|text\/html/i.test(msg)) {
        var key = 'foody_last_chunk_reload';
        var last = Number(sessionStorage.getItem(key) || 0);
        if (Date.now() - last > 8000) {
          sessionStorage.setItem(key, String(Date.now()));
          window.location.reload();
        }
      }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var msg = String(e && (e.reason && (e.reason.message || e.reason) || '') || '');
      if (/loading chunk|failed to fetch dynamically imported module|importing a module script failed|mime type|not a valid javascript|text\/html/i.test(msg)) {
        var key = 'foody_last_chunk_reload';
        var last = Number(sessionStorage.getItem(key) || 0);
        if (Date.now() - last > 8000) {
          sessionStorage.setItem(key, String(Date.now()));

    });
